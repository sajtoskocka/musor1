<script>
const C=JSON.parse(document.getElementById('c').textContent),K='okt23_'+C.id;let S={},NM='';
try{S=JSON.parse(localStorage.getItem(K)||'{}');NM=localStorage.getItem('okt23_nev')||''}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const m=document.getElementById('m');
function R(){
let h=`<div class="hd"><span class="n">${C.id}</span><div><small>ÁLLOMÁS</small><h1>${C.title}</h1><p>${C.sub}</p></div></div>`;
if(C.img)h+=`<img class="p" src="${C.img}" alt="">`;
h+=`<div class="card"><ul>${C.bul.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
if(C.tud)h+=`<div class="card tud"><b>TUDTAD?</b>${C.tud}</div>`;
if(C.vid.length)h+=`<div class="card vid">${C.vid.map(v=>`<a href="${v[1]}" target="_blank" rel="noopener">${v[0]}</a>`).join('')}</div>`;
C.items.forEach((it,i)=>{
h+=`<div class="card"><p class="q">${i+1}. ${it.q}</p>`;
if(it.t=='c')it.o.forEach((o,j)=>{const s=S[i];let c='o';if(s==j)c+=j==it.a?' ok':' no';h+=`<button class="${c}" onclick="P(${i},${j})">${o}</button>`});
if(it.t=='c'&&S[i]!=null)h+=`<div class="fb">${S[i]==it.a?'✅ Helyes!':'❌ Nem talált, próbáld újra!'}</div>`;
if(it.t=='x')h+=`<textarea placeholder="${it.ph}" oninput="S[${i}]=this.value;sv()">${(S[i]||'').replace(/</g,'&lt;')}</textarea>`;
if(it.t=='o'){const a=S[i]||[];it.o.forEach((o,j)=>{const k=a.indexOf(j);h+=`<button class="o${k>=0?' sel':''}" onclick="O(${i},${j})">${k>=0?'<b>'+(k+1)+'.</b> ':''}${o}</button>`});
h+=`<button class="b g" onclick="V(${i})">Ellenőrzés</button><button class="b l" onclick="S[${i}]=[];delete S['v${i}'];sv();R()">Törlés</button>`;
if(S['v'+i]!=null)h+=`<div class="fb">${S['v'+i]?'✅ Tökéletes sorrend!':'❌ Még nem jó, próbáld újra!'}</div>`}
h+='</div>'});
h+=`<div class="card"><p class="q">Neved / csapatod</p><input class="nm" value="${NM.replace(/"/g,'&quot;')}" oninput="NM=this.value;try{localStorage.setItem('okt23_nev',NM)}catch(e){}"></div><button class="b g" onclick="CP()">Válaszaim másolása</button><span class="fb" id="cp"></span>`;
m.innerHTML=h}
function P(i,j){S[i]=j;sv();R()}
function O(i,j){const a=S[i]||[];if(!a.includes(j))a.push(j);S[i]=a;delete S['v'+i];sv();R()}
function V(i){const a=S[i]||[],c=C.items[i].a;S['v'+i]=a.length==c.length&&a.every((x,k)=>x==c[k]);sv();R()}
function CP(){let t=`${C.id}. állomás – ${C.title}\n${NM}\n`;C.items.forEach((it,i)=>{let a=S[i];if(it.t=='c')a=a!=null?it.o[a]:'';if(it.t=='o')a=(a||[]).map(x=>it.o[x]).join(' > ');t+=`${i+1}. ${a||''}\n`});
const e=document.getElementById('cp');try{navigator.clipboard.writeText(t).then(()=>e.textContent='Kimásolva!',()=>e.textContent='Nem sikerült másolni')}catch(x){e.textContent='Nem sikerült másolni'}}
R();
</script></body></html>
